# pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: biome
        name: biome check
        entry: npx --no-install biome check --no-errors-on-unmatched --files-ignore-unknown=true
        language: system
        types_or: [javascript, ts, json]
