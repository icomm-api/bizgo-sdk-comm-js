# v* 태그를 push하면 npm에 배포합니다. npm Trusted Publishing(GitHub OIDC)을 쓰므로 저장소에 npm 토큰을 두지 않습니다.
#
# 사전 설정 (한 번만):
# 1. npmjs.com > @bizgo/bizgo-sdk-comm-js > Settings > Trusted Publisher에서 GitHub Actions를 추가합니다.
#    Organization/user: icomm-api, Repository: bizgo-sdk-comm-js, Workflow filename: release.yml, Environment: npm
# 2. 같은 화면의 Publishing access를 "Require two-factor authentication and disallow tokens"로 두어 토큰 배포를 막습니다.
# 3. GitHub 저장소 Settings > Environments > npm을 만들고 Required reviewers(필수 승인자)를 지정합니다.
#    Deployment branches and tags는 태그 v*만 허용합니다.
# 배포에는 npm CLI 11.5.1 이상이 필요합니다(Node.js 24에 포함). provenance는 --provenance로 함께 게시됩니다.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: 태그와 패키지 버전이 같은지
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run generate:check
      - run: npm audit --omit=dev
      - run: npm run build
      - run: npm run smoke:pack
      - name: tarball 만들기
        run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package
          path: "*.tgz"
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing(OIDC)과 provenance 서명에 필요
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: package
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm CLI 버전 확인 (Trusted Publishing은 11.5.1 이상)
        run: node -e "const [a,b,c]=require('child_process').execSync('npm --version').toString().trim().split('.').map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) process.exit(1)"
      - name: npm publish
        run: npm publish ./*.tgz --provenance --access public --ignore-scripts
